burgr-model-version: 1.0.0

aggregate_roots:
  # ---- #
  local_user:
    properties:
      name:
        is_unique: true
        field_size: 50
      hashed_password:

  # ---- #
  user:
    properties:
      email:
        is_unique: true
        field_size: 50
      provider:
        field_size: 50
      technical_user: bool
      preferences: preferences?
      user_rights: ~>user_right[]
    dependencies:
      local_user: read
    rules:
      before_add:
        - create_local_user
    factories:
      create_local:
        inputs:
          email:
    event_produced: remove
    api:
      query:
      get:
      add:
        mandatory_right: ManageUsers
      update:
        mandatory_right: ManageUsers
      remove:
        mandatory_right: ManageUsers

  # ---- #
  invite:
    properties:
      email:
        is_queryable: true
      status: $invite_status
      creator: user
      creator_name:
      creator_message:
      is_open: =bool
    api:
      query:
      get:
      add:

  # ---- #
  team:
    properties:
      name:
        is_unique: true
        field_size: 50
      description:
        type: string?
        field_size: 200
      members: ~>team_member[]
    dependencies:
      user: read
    rules:
      before_add:
        - check_members
      before_update:
        - check_members
      before_remove:
        - check_no_member
    api:
      query:
      get:
      add:
        mandatory_right: ManageTeams
      update:
        mandatory_right: ManageTeams
      remove:
        mandatory_right: ManageTeams

enums:
  invite_status:
    values:
      Sent: 0
      Used: 1
      Declined: 2
