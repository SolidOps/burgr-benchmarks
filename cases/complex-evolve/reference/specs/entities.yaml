burgr-model-version: 1.0.0

entities:
  # ---- #
  right:
    properties:
      name:
        field_size: 50
        is_unique: true

  # ---- #
  user_right:
    properties:
      user:
        type: user
        multiple_unique_constraint_with: right
      right: right

  # ---- #
  team_member:
    properties:
      team:
        type: team
        multiple_unique_constraint_with: user_email
      user_email:
        field_size: 50
      is_owner: bool
